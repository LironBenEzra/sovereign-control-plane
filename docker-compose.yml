# One command:  docker compose up --build
# Then open     http://localhost:8000
#
# Everything in this file is inside the trust boundary. The only way out is the
# control plane's egress gateway, and only when the policy allows it.

name: sovereign-control-plane

services:
  control-plane:
    build: .
    ports:
      - "8000:8000"
    environment:
      SCP_SOVEREIGN_PROVIDER: ${SCP_SOVEREIGN_PROVIDER:-ollama}
      SCP_OLLAMA_URL: http://ollama:11434
      # Answers prompts that stay inside, and also runs the semantic detector.
      SCP_SOVEREIGN_MODEL: ${SCP_SOVEREIGN_MODEL:-llama3.2:3b}
      SCP_EXTERNAL_MODEL: ${SCP_EXTERNAL_MODEL:-claude-haiku-5-5}
      # Haiku has no server-side refusal fallback; set true only with a model that has one.
      SCP_EXTERNAL_REFUSAL_FALLBACK: ${SCP_EXTERNAL_REFUSAL_FALLBACK:-false}
      # Saving policy changes: an admin token, or open to anyone (a demo setting).
      SCP_ADMIN_TOKEN: ${SCP_ADMIN_TOKEN:-}
      SCP_OPEN_POLICY_EDITING: ${SCP_OPEN_POLICY_EDITING:-false}
      # Put it in a .env file next to this one. Without a key the external model is not
      # ready: prompts the policy lets out are refused, and prompts that stay inside work.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      # The shipped policy: seeds the data volume on first start, and is what a restore puts back.
      - ./policy:/app/policy:ro
      # Audit log, policy snapshots and keys.
      - scp-data:/app/data
    depends_on:
      - ollama

  # The sovereign model, which also runs the semantic detector. No port is published: it
  # is reachable only from inside this Compose network.
  ollama:
    image: ollama/ollama:latest
    environment:
      # Keep the model loaded. Ollama otherwise unloads it after 5 idle minutes, and the
      # next prompt then waits for it to load, which can exceed the detection time budget,
      # so that prompt is treated as private.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama-models:/root/.ollama

  # Pulls the model once, then exits. Until it finishes, requests that must stay in the
  # boundary are blocked, and the semantic detector fails, so every prompt is treated as
  # private (fail closed). Nothing is sent anywhere else.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${SCP_SOVEREIGN_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$$MODEL"
    restart: "no"

volumes:
  scp-data:
  ollama-models:
