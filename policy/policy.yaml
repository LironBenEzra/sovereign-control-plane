# Sovereign control plane policy.
#
# The shipped default. On first start it is copied into data/policies/ as a snapshot named
# by its SHA-256, and from then on the policy in force changes only through the Policy tab
# or PUT /v1/policy, each change under a new version. Editing this file changes nothing in
# force: "Back to the original policy" is what puts this file back. Every audit record
# names the SHA-256 of the exact text that was in force.
#
# If the policy in force is missing, modified on disk or invalid, every request is blocked
# until it is restored.

id: default-sovereign-policy
version: "1.4.0"
description: Keep secrets and prompt injections out of every model, keep regulated data and confidential business content in the boundary, redact contact PII.

# What counts as private data: category -> entity types the detectors look for.
# An entity type that is not listed here is not looked for.
categories:
  secret:
    - PRIVATE_KEY
    - AWS_ACCESS_KEY
    - GITHUB_TOKEN
    - SLACK_TOKEN
    - API_KEY
    - JWT
    - CONNECTION_STRING
    - CREDENTIAL_ASSIGNMENT
  possible_secret:
    - HIGH_ENTROPY_STRING
  government_id:
    - US_SSN
    - US_PASSPORT
    - US_ITIN
  financial:
    - CREDIT_CARD
    - IBAN_CODE
  health:
    - MEDICAL_LICENSE
    - HEALTH_CONTEXT
  pii:
    - PERSON
    - EMAIL_ADDRESS
    - PHONE_NUMBER
    - IP_ADDRESS
    # LOCATION is left out on purpose: the NER model tags every country and city, so
    # "What is the capital of France?" would be redacted. Add it here to turn it on.
  # Found by the semantic detector, a local model that judges what the text is about.
  # A finding covers the passage it judged, not a single value. Remove a type to stop
  # looking for it; with none listed, the model is not called at all.
  confidential_business:
    - UNRELEASED_PRODUCT
    - INTERNAL_MEETING
    - NONPUBLIC_FINANCIAL
    - INTERNAL_CONFIDENTIAL
  # Also found by the semantic detector: text that tries to control the AI system it is
  # sent to (override its rules, reveal its instructions, hidden orders in a document).
  prompt_injection:
    - PROMPT_INJECTION

detection:
  # Findings scoring below this are ignored as noise.
  min_score: 0.35
  # If every finding is below this, the classification is "uncertain".
  confident_score: 0.6

# Rules are checked top to bottom. The first rule that matches wins.
rules:
  - id: block-secrets
    description: Credentials and secrets are never sent to any model.
    when:
      any_category: [secret]
    action: block

  - id: block-prompt-injection
    description: Text that tries to take control of the AI system it is sent to is not sent to any model.
    when:
      any_category: [prompt_injection]
    action: block

  - id: block-when-detection-failed
    description: A detector failed or ran out of time, so the prompt could not be checked. It is not sent to any model.
    when:
      label: [unknown_assume_private]
    action: block

  - id: keep-regulated-in-boundary
    description: Regulated data (government IDs, financial, health) is answered by the sovereign model only.
    when:
      any_category: [government_id, financial, health]
    action: route_sovereign

  - id: keep-confidential-business-in-boundary
    description: Non-public company information (unreleased products, internal meetings, non-public financials) is answered by the sovereign model only.
    when:
      any_category: [confidential_business]
    action: route_sovereign

  - id: keep-possible-secrets-in-boundary
    description: A high-entropy string may be a credential, so the prompt stays in the boundary.
    when:
      any_category: [possible_secret]
    action: route_sovereign

  - id: protect-when-unsure
    description: Detection found only low-confidence evidence, so the prompt is treated as private.
    when:
      label: [uncertain]
    action: route_sovereign

  - id: redact-pii
    description: Personal data is replaced with placeholders before the prompt leaves the boundary.
    when:
      any_category: [pii]
    action: redact

  - id: allow-clean
    description: No private data was found, so the prompt may go to the external model.
    when:
      label: [no_private_data]
    action: allow

# Applies when no rule matches. Must be block or route_sovereign.
default_action: block

egress:
  # Default deny. A prompt leaves the boundary only if a rule says allow or redact
  # AND the destination is listed here. Remove an entry to cut that destination off.
  allowed_destinations:
    - anthropic

response:
  # Categories removed from a model's answer before it is returned to the caller.
  # confidential_business is found by the semantic detector, so listing it has the local
  # model judge every answer too, and a finding removes the whole passage it judged.
  redact_categories: [secret, confidential_business]
  # After "redact", put the original values back into the answer, inside the boundary.
  restore_placeholders: true

block_message: This request was blocked by the data protection policy. No model was called.
